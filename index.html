<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қазақ көтерілістері — Кроссворд</title>
<style>
:root {
  --bg: #f4f6f8; --card: #ffffff; --fg: #111827; --muted: #6b7280;
  --line: #d1d5db; --cell: #ffffff; --accent: #2563eb;
  --ok: #dcfce7; --okb: #16a34a; --bad: #fee2e2; --badb: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827; --card: #1f2937; --fg: #f9fafb; --muted: #9ca3af;
    --line: #374151; --cell: #1f2937; --accent: #3b82f6;
    --ok: #064e3b; --okb: #10b981; --bad: #7f1d1d; --badb: #ef4444;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0; padding: 20px 16px;
  display: flex; justify-content: center;
}
.container { max-width: 900px; width: 100%; }
header { margin-bottom: 20px; text-align: center; }
h1 { margin: 0 0 8px; font-size: 24px; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }

.layout { display: flex; gap: 24px; align-items: flex-start; }
@media (max-width: 768px) { .layout { flex-direction: column; } }

.card {
  background: var(--card); border-radius: 12px; padding: 16px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
}
.gridwrap { overflow-x: auto; margin-bottom: 16px; }
table { border-collapse: collapse; margin: 0 auto; }
td { width: 32px; height: 32px; padding: 0; position: relative; border: none; }
td.c { border: 1px solid var(--line); background: var(--cell); }
td input {
  width: 100%; height: 100%; border: 0; background: transparent;
  color: var(--fg); text-align: center; font-size: 16px; font-weight: bold;
  text-transform: uppercase; padding: 0; outline: none; border-radius: 2px;
}
td input:focus { background: rgba(59, 130, 246, 0.1); box-shadow: inset 0 0 0 2px var(--accent); }
td i {
  position: absolute; top: 1px; left: 2px; font-size: 9px;
  font-style: normal; font-weight: bold; color: var(--muted); pointer-events: none;
}
td.ok input { background: var(--ok); color: var(--okb); }
td.bad input { background: var(--bad); color: var(--badb); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
button {
  appearance: none; border: 1px solid var(--line); background: var(--card);
  color: var(--fg); padding: 8px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: white; border-color: var(--accent); }
button.primary:hover { background: #1d4ed8; }

.clues { flex: 1; min-width: 280px; }
.clues h3 { margin: 0 0 12px; font-size: 16px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
.clues h3:not(:first-child) { margin-top: 24px; }
.clue { font-size: 14px; line-height: 1.5; margin-bottom: 8px; display: flex; gap: 8px; }
.clue b { color: var(--fg); min-width: 20px; text-align: right; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Қазақ көтерілістері</h1>
    <p class="sub">Тарихи кроссворд · жауаптарды толтырыңыз</p>
  </header>

  <div class="layout">
    <div class="card" style="flex-shrink: 0;">
      <div class="gridwrap">
        <table id="t"></table>
      </div>
      <div class="toolbar">
        <button class="primary" onclick="chk()">Тексеру</button>
        <button onclick="rev()">Жауаптарды көрсету</button>
        <button onclick="clr()">Тазалау</button>
      </div>
    </div>

    <div class="card clues">
      <h3>Көлденең</h3>
      <div id="a"></div>
      <h3>Тік</h3>
      <div id="d"></div>
    </div>
  </div>
</div>

<script>
// Готовая сетка, где все слова идеально связаны
const D = {
  "R": 13, 
  "C": 13,
  "cells": {
    "0,4":"Н","0,5":"Ұ","0,6":"Р","0,7":"А","0,8":"Л","0,9":"Ы",
    "1,4":"А","2,4":"У","3,4":"Р","4,4":"Ы","5,4":"З","6,4":"Б","7,4":"А","8,4":"Й",
    "2,3":"А","2,5":"Қ","2,6":"М","2,7":"О","2,8":"Л","2,9":"А",
    "3,2":"Ж","3,3":"А","3,4":"Н","3,5":"Т","3,6":"А","3,7":"Й",
    "4,1":"О","4,2":"Р","4,3":"С","4,4":"К",
    "5,1":"Ж","5,2":"А","5,3":"Ң","5,4":"А","5,5":"Қ","5,6":"А","5,7":"Л","5,8":"А",
    "6,2":"С","6,3":"П","6,4":"Е","6,5":"Р","6,6":"А","6,7":"Н","6,8":"С","6,9":"К","6,10":"И","6,11":"Й",
    "7,4":"І","8,4":"Р",
    "7,0":"Ж","7,1":"А","7,2":"Ң","7,3":"А","7,4":"Е","7,5":"Л","7,6":"Е","7,7":"К",
    "9,1":"Ш","9,2":"О","9,3":"Қ","9,4":"А","9,5":"Н",
    "0,12":"Д","1,12":"О","2,12":"С","3,12":"А","4,12":"Н",
    "5,0":"О","6,0":"Т","7,0":"А","8,0":"Р","9,0":"Ш","10,0":"Ы","11,0":"Л","12,0":"Д",
    "8,6":"Қ","9,6":"О","10,6":"Қ","11,6":"А","12,6":"Н",
    "8,8":"Ж","9,8":"А","10,8":"Ң","11,8":"А","12,8":"Е","13,8":"Л","14,8":"Е","15,8":"К"
  },
  "nums": {
    "0,4":1, "2,3":2, "3,2":3, "4,1":4, "5,1":5, "6,2":6, "7,0":7, "7,1":8, "9,1":9, "0,12":10, "5,0":11, "8,6":12, "8,8":13
  },
  "A": [
    [1, "Сырым «бұзау еті ауызында кеткен» деп сынаған, Кіші жүздің ханы?"],
    [2, "Кенесары хандығының соңғы астанасы болған бекініс?"],
    [3, "Кенесарының інісі, батыр?"],
    [4, "Есет Көтібарұлы шабуыл жасаған, Жайық бойындағы бекініс?"],
    [5, "Жанқожа 1856 жылы салған бекіністің аты?"],
    [6, "1822 және 1824 жылғы жарлықтардың авторы?"],
    [7, "Махамбет «Хан емессің, қасқырсың» деген Ішкі Орда ханы?"],
    [9, "Шыңғыс сұлтанның баласы, қазақтың тұңғыш ғалымы?"]
  ],
  "D": [
    [8, "1838 жылғы 12 шілдедегі Исатай мен Махамбет көтерілісінің шешуші шайқасы өткен өзен?"],
    [10, "1870 жылғы Маңғыстау көтерілісінің басшысы?"],
    [11, "«Елек қорғанысы» деп аталған шеп?"],
    [12, "Сырдарияның арғы бетіндегі хандық?"],
    [13, "Кенесарыға қарсы салынған шекара шебі?"]
  ]
};

const t = document.getElementById('t');
for (let r=0; r<D.R; r++) {
  const tr = t.insertRow();
  for (let c=0; c<D.C; c++) {
    const td = tr.insertCell(), k = r+','+c;
    if (D.cells[k]) {
      td.className = 'c';
      td.innerHTML = (D.nums[k] ? '<i>'+D.nums[k]+'</i>' : '') + '<input maxlength="1" autocomplete="off" autocorrect="off" spellcheck="false" data-a="'+D.cells[k]+'">';
    }
  }
}

const I = [...document.querySelectorAll('input')];
I.forEach((inp, idx) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.toUpperCase().slice(-1);
    inp.parentNode.classList.remove('ok', 'bad');
    if (inp.value && I[idx+1]) I[idx+1].focus();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && I[idx-1]) I[idx-1].focus();
  });
});

function chk() {
  I.forEach(i => {
    const p = i.parentNode;
    p.classList.remove('ok', 'bad');
    if (!i.value) return;
    p.classList.add(i.value.toUpperCase() === i.dataset.a ? 'ok' : 'bad');
  });
}
function rev() {
  I.forEach(i => {
    i.value = i.dataset.a;
    i.parentNode.classList.remove('bad');
    i.parentNode.classList.add('ok');
  });
}
function clr() {
  I.forEach(i => {
    i.value = '';
    i.parentNode.classList.remove('ok', 'bad');
  });
}

const f = (list, id) => document.getElementById(id).innerHTML = list.map(x => '<div class="clue"><b>'+x[0]+'.</b><span>'+x[1]+'</span></div>').join('');
f(D.A, 'a');
f(D.D, 'd');
</script>
</body>
</html>
